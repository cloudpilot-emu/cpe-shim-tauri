<html>
    <head>
        <style>
            body {
                background: white;
            }

            img.logo.dark {
                display: none;
            }

            img {
                display: block;
            }

            @keyframes fade {
                0%,
                100% {
                    opacity: 0.3;
                }
                50% {
                    opacity: 1;
                }
            }

            img.connection-issue {
                margin-top: 5vh;

                max-width: 35px;
                max-height: 35px;

                animation: fade 2s ease-in-out infinite;

                visibility: hidden;
            }

            .connection-issue img.connection-issue {
                visibility: visible;
            }

            @media (max-aspect-ratio: 1) {
                img.logo {
                    width: 60vw;
                    width: 60dvw;
                }

                img.connection-issue {
                    width: 10vw;
                    width: 10dvw;

                    margin-bottom: 10dvh;
                }
            }

            @media (min-aspect-ratio: 1) {
                img.logo {
                    height: 60vh;
                    height: 60dvh;
                }

                img.connection-issue {
                    height: 10vh;
                    height: 10dvh;
                }
            }

            @media (prefers-color-scheme: dark) {
                body {
                    background: black;
                }

                img.logo.light {
                    display: none;
                }

                img.logo.dark {
                    display: block;
                    filter: invert();
                }

                img.connection-issue {
                    filter: invert();
                }
            }

            .container {
                display: flex;
                width: 100%;
                height: 100%;
                align-items: center;
                justify-content: center;
                flex-direction: column;
            }
        </style>
    </head>

    <body>
        <div class="container">
            <img class="light logo" src="/splashscreen/cp-palmblue-001.svg" />
            <img class="dark logo" src="/splashscreen/cp-palmblue-001-bw.svg" />
            <img class="connection-issue" src="/splashscreen/connection-issue.svg" />
        </div>
    </body>
</html>
