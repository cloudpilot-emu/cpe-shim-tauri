name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - macos
          - linux
          - windows
          - android

permissions:
  contents: write

jobs:
  validate-version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Check tauri.conf.json version matches tag
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME}"
          CONF_VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          if [ "$TAG" != "$CONF_VERSION" ]; then
            echo "::error::Tag ($TAG) does not match version in tauri.conf.json ($CONF_VERSION)"
            exit 1
          fi
          echo "Version $TAG confirmed."

  build-macos:
    needs: validate-version
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform
      == 'macos'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install git-crypt
        run: brew install git-crypt

      - name: Unlock signing keys
        shell: bash
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: echo "$GIT_CRYPT_KEY" | base64 -d > /tmp/key && git-crypt unlock /tmp/key
          && rm /tmp/key

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm install

      - name: Build
        run: npm run tauri-build

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          draft: true
          body: |
            ## General notes

            CloudpilotEmu is a web app. The native app is a shim that run CloudpilotEmu in a sytem web view which offers seamless access to the host clipboard and network (if configured in the settings). The app will take a few seconds on first start to load its service worker which will enable offline operation. You can switch between the preview and native buulds of CloudpilotEmu on the settings page.

            If you run into any issues with the native app you can always head over to the [web page](https://cloudpilot-emu.github.io) and run CloudpilotEmu in your browser. The web app runs in any resonably recent browser and has the same performance and feature set, apart from clipboard integration (which requests confirmation prompts) and networking (which needs a [proxy](https://github.com/cloudpilot-emu/cloudpilot-emu) to work on the web app).

            ## Known issues

            * **Android**: Old versions of Android may have trouble loading the app.
            * **Android**: The app requires a recent version of Chrome or (on newer devices) the system webview.
            * **Android**: Due to idiosyncrasies of Android's webview, the native ap may be very slightly lower than the web app running on chrome.
            * **MacOS**: Starting the app without an internet connection will stall for a few seconds before the app loads.
            * **Linux**: The app will not start without an internet connection.

            ## Executable downloads

            | Platform | File |
            |----------|------|
            | macOS (Apple Silicon)| `.dmg` |
            | Linux (amd64) | `.AppImage` |
            | Linux (aarch64) | `.AppImage` |
            | Windows (amd64) | `*-setup.exe` (NSIS) or `.msi` |
            | Android | `.apk` |
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz

      - name: Stage updater signature
        if: github.event_name == 'push'
        run: |
          mkdir updater-staging
          cp src-tauri/target/release/bundle/macos/*.app.tar.gz.sig updater-staging/signature
          basename src-tauri/target/release/bundle/macos/*.app.tar.gz > updater-staging/filename

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: updater-sig-darwin-aarch64
          path: updater-staging/

  build-linux:
    needs: validate-version
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform
      == 'linux'
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y git-crypt patchelf xdg-utils
          librsvg2-dev libwebkit2gtk-4.1-dev

      - name: Unlock signing keys
        shell: bash
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: echo "$GIT_CRYPT_KEY" | base64 -d > /tmp/key && git-crypt unlock /tmp/key
          && rm /tmp/key

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm install

      - name: Install experimental appimage branch
        run: cd src-tauri && cargo install tauri-cli --git https://github.com/tauri-apps/tauri --branch feat/truly-portable-appimage

      - name: Build
        env:
          TAURI_BUNDLER_NEW_APPIMAGE_FORMAT: "true"
        run: npm run tauri-build -b appimage

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          draft: true
          files: src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Stage updater signature
        if: github.event_name == 'push'
        run: |
          mkdir updater-staging
          cp src-tauri/target/release/bundle/appimage/*.AppImage.sig updater-staging/signature
          basename src-tauri/target/release/bundle/appimage/*.AppImage > updater-staging/filename

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: updater-sig-linux-${{ matrix.arch }}
          path: updater-staging/

  build-windows:
    needs: validate-version
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform
      == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install git-crypt
        shell: pwsh
        run: |
          iex "& {$(irm get.scoop.sh)} -RunAsAdmin"
          scoop install git-crypt
          Join-Path $env:USERPROFILE "scoop\shims" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Unlock signing keys
        shell: bash
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: echo "$GIT_CRYPT_KEY" | base64 -d > /tmp/key && git-crypt unlock /tmp/key
          && rm /tmp/key

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm install

      - name: Build
        run: npm run tauri-build

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          draft: true
          files: |
            src-tauri/target/release/bundle/nsis/*_x64-setup.exe
            src-tauri/target/release/bundle/msi/*_x64_en-US.msi

      - name: Stage updater signature
        if: github.event_name == 'push'
        shell: bash
        run: |
          mkdir updater-staging
          cp src-tauri/target/release/bundle/nsis/*_x64-setup.exe.sig updater-staging/signature
          basename src-tauri/target/release/bundle/nsis/*_x64-setup.exe > updater-staging/filename

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: updater-sig-windows-x86_64
          path: updater-staging/

  build-android:
    needs: validate-version
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform
      == 'android'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install git-crypt
        run: sudo apt-get update && sudo apt-get install -y git-crypt

      - name: Unlock signing keys
        shell: bash
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: echo "$GIT_CRYPT_KEY" | base64 -d > /tmp/key && git-crypt unlock /tmp/key
          && rm /tmp/key

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.0.12077973"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm install

      - name: Initialize Android project
        run: npm run tauri-android-init

      - name: Build Android
        run: npm run tauri-build-android

      - name: Sign APK
        if: github.event_name == 'push'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          TAG=${GITHUB_REF_NAME}
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -1)
          $APKSIGNER sign \
            --ks signing/keystore.jks \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias signing \
            --out cloudpilotemu-$TAG.apk \
            src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          draft: true
          files: cloudpilotemu-*.apk

  update-json:
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    needs: [ build-macos, build-linux, build-windows ]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: updater-sig-*

      - name: Build tauri-updates.json
        run: |
          TAG="${GITHUB_REF_NAME}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          REPO="${GITHUB_REPOSITORY}"

          read_platform() {
            local dir="$1"
            local sig
            local filename
            sig="$(cat "$dir/signature")"
            filename="$(cat "$dir/filename")"
            echo "{\"signature\":\"$sig\",\"url\":\"https://github.com/$REPO/releases/download/$TAG/$filename\"}"
          }

          DARWIN=$(read_platform updater-sig-darwin-aarch64)
          LINUX_X86_64=$(read_platform updater-sig-linux-x86_64)
          LINUX_AARCH64=$(read_platform updater-sig-linux-aarch64)
          WINDOWS=$(read_platform updater-sig-windows-x86_64)

          cat > tauri-updates.json <<EOF
          {
            "version": "$TAG",
            "pub_date": "$PUB_DATE",
            "platforms": {
              "darwin-aarch64": $DARWIN,
              "linux-x86_64": $LINUX_X86_64,
              "linux-aarch64": $LINUX_AARCH64,
              "windows-x86_64": $WINDOWS
            }
          }
          EOF

          echo "--- tauri-updates.json ---"
          cat tauri-updates.json

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: tauri-updates.json
